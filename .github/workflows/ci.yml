name: ReturnGuard CI

on:
  push:
  pull_request:

jobs:
  quality-and-synthetic-lifecycle:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9.6"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt -c constraints-stage4.txt
      - run: ruff check .
      - run: pytest -m "not raw_training_data and not historical_test_data and not full_rebuild"
